<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('error-data').textContent);
const input=document.getElementById('search'),list=document.getElementById('list'),counter=document.getElementById('count'),empty=document.getElementById('empty'),more=document.getElementById('more');
let selected='all',visible=24,matched=[];
const norm=x=>String(x??'').normalize('NFKC').toLowerCase();
const clean=x=>norm(x).replace(/[+]/g,'');
function appendText(p,txt,words){const s=String(txt??'');if(!words.length){p.textContent=s;return;}const terms=[...new Set(words)].filter(Boolean).sort((a,b)=>b.length-a.length);const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig');let last=0;for(const match of s.matchAll(re)){const at=match.index;if(at>last)p.append(document.createTextNode(s.slice(last,at)));const mark=document.createElement('mark');mark.textContent=match[0];p.append(mark);last=at+match[0].length;}if(last<s.length)p.append(document.createTextNode(s.slice(last)));}
function makeCard(d,words){
 const el=document.createElement('article');el.className='entry';
 const hd=document.createElement('div');hd.className='entry-head';
 const heading=document.createElement('div');heading.className='heading';
 const c=document.createElement('span');c.className='code'+(d.kind==='source'?'':' ambient');appendText(c,d.code,words);heading.append(c);
 const h=document.createElement('h2');appendText(h,d.stage,words);heading.append(h);hd.append(heading);
 const meta=document.createElement('div');meta.className='meta';meta.textContent=d.prog+(d.line?' · 源码第 '+d.line+' 行':'');hd.append(meta);el.append(hd);
 const body=document.createElement('div');body.className='info';
 for(const [label,txt] of [['触发条件',d.trigger],['处理办法',d.advice]]){const k=document.createElement('span');k.className='k';k.textContent=label;const v=document.createElement('span');v.className='v';appendText(v,txt,words);body.append(k,v)}el.append(body);
 if(d.snippet){const wrap=document.createElement('div');wrap.className='code-box';const details=document.createElement('details');const sum=document.createElement('summary');sum.textContent='查看对应 VBA 代码';const pre=document.createElement('pre');const code=document.createElement('code');code.textContent=d.snippet;pre.append(code);details.append(sum,pre);wrap.append(details);el.append(wrap)}
 return el;
}
function refresh(reset=true){if(reset)visible=24;
const terms=norm(input.value).trim().split(/\s+/).filter(Boolean),cleanTerms=terms.map(clean);
matched=data.filter(d=>{
 if(selected!=='all'&&d.prog!==selected)return false;
 const content=norm([d.code,d.full,d.num,d.prog,d.stage,d.trigger,d.advice].join(' '));const ccontent=clean(content);
 return terms.every((t,i)=>{if(/^\+?\d{4}$/.test(t))return d.kind==='source' && String(d.num)===t.replace('+','');if(/^-2147\d{6}$/.test(t))return String(d.full)===t;return content.includes(t)||ccontent.includes(cleanTerms[i]);});
});
const words=terms.filter(t=>t.length>0 && !/^[-+]?[\d]+$/.test(t));
list.replaceChildren(...matched.slice(0,visible).map(d=>makeCard(d,words)));
counter.textContent=`找到 ${matched.length} 项`;
empty.style.display=matched.length?'none':'block';more.hidden=visible>=matched.length;
}
input.addEventListener('input',()=>refresh());document.getElementById('clear').addEventListener('click',()=>{input.value='';input.focus();refresh()});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(n=>{n.classList.toggle('selected',n===b);n.setAttribute('aria-pressed',String(n===b));});refresh();}));
more.addEventListener('click',()=>{visible+=40;refresh(false)});
if(window.location.hash.startsWith('#')){const val=decodeURIComponent(window.location.hash.slice(1));if(val){input.value=val;}}
refresh();
})();
</script>
